    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h3>Unordered List</h3>
    <ul>

        <li>Banana</li>
    </ul>

    <h3>Nested List</h3>
    <ul>
        <li>Programming
            <ul>
                <li>C++</li>
                <li>Python</li>
            </ul>
        </li>
    </ul>

            <th>Name</th>
