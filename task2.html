<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting</title>
</head>
<body>

    <h1>Main Heading</h1>
    <h2>Sub Heading</h2>
    <h3>Smaller Heading</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <p>This is a paragraph.</p>

    <p><b>Bold Text</b></p>
    <p><i>Italic Text</i></p>
    <p><u>Underlined Text</u></p>

    <p>Line 1<br>Line 2</p>

    <hr>

    <p>H<sub>2</sub>O (Subscript)</p>
    <p>X<sup>2</sup> (Superscript)</p>

    <!-- This is a comment -->

</body>
</html>
